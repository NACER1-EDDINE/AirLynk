[package]
name = "airlynk"
version = "0.1.0"
description = "AirLynk — LAN file transfer wrapped in a tamper-evident sleeve"
authors = ["AirLynk"]
edition = "2021"

[lib]
name = "airlynk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.9"
base64 = "0.22"
subtle = "2"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "sync", "time", "macros", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
if-addrs = "0.13"
qrcode = { version = "0.14", features = ["svg"] }
percent-encoding = "2"
mime_guess = "2"
bytes = "1"
airlynk-crypto = { path = "../crates/airlynk-crypto" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Foundation"] }
